<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vestigium</title>
  <meta name="description" content="See real changes in the infrared sky. Make a prediction. Check it against NASA SPHEREx observations.">
  <meta name="theme-color" content="#05070d">
  <!-- Link previews. Crawlers do not run scripts, so these few words cannot come from js/i18n.js.
       og.png is a screenshot of this site (Barnard's Star: AllWISE 2010 next to SPHEREx 2026).
       Absolute addresses: the public site is https://nama2323.github.io/tenger/ (repository public, 15 Nov 2026). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vestigium">
  <meta property="og:title" content="Vestigium: see the changing sky">
  <meta property="og:description" content="See real changes in the infrared sky. Make a prediction. Check it against NASA SPHEREx observations.">
  <meta property="og:url" content="https://nama2323.github.io/tenger/">
  <meta property="og:image" content="https://nama2323.github.io/tenger/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Vestigium showing Barnard's Star in two infrared images, AllWISE from 2010 and NASA SPHEREx from 2026, side by side.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The team's logo, from the team's files in img/ (unchanged): header vestigium-logo-white.png, tab icons
       favicon.svg and favicon-32.png, home-screen icon favicon-180.png, manifest favicon-192/512.png, printed
       lessons vestigium-logo-navy.png. og.png is a screenshot of the site, re-rendered after a logo change. -->
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/favicon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=tenger-h1">
</head>
<body data-page="home">
  <a class="skip" href="#main" data-t="site.skip"></a>
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

  <header class="topbar">
    <a id="logo" class="brand" href="./" data-page-link="home">
      <img class="brand-logo" src="img/vestigium-logo-white.png" alt="Vestigium" width="121" height="30">
    </a>
    <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-t="nav.menu"></button>
    <nav id="site-nav" class="nav" data-t-label="nav.label">
      <button type="button" data-page-link="home" data-t="nav.home"></button>
      <button type="button" data-page-link="predictions" data-t="nav.predictions"></button>
      <button id="nav-planetx" type="button" class="nav-planetx"><span data-t="nav.planetx"></span><span class="new-dot" aria-hidden="true"></span><span class="sr-only" data-t="chip.new"></span></button>
      <button type="button" data-page-link="game" data-t="nav.game"></button>
      <button type="button" data-page-link="learn" data-t="nav.learn"></button>
      <button type="button" data-page-link="about" data-t="nav.about"></button>
      <button type="button" class="nav-extra" data-dialog="limits" aria-haspopup="dialog" data-t="limits.button"></button>
      <!-- Guided tour and more (moved from the Home panel, task B16). Real sky only where the local server runs. -->
      <details id="nav-more" class="nav-more">
        <summary><span class="more-short" aria-hidden="true" data-t="nav.more"></span><span class="more-long" data-t="home.more"></span></summary>
        <div class="nav-more-list">
          <button id="tour-start" type="button" class="quiet" data-t="tour.start"></button>
          <button id="top-places" type="button" class="quiet" data-t="topPlaces"></button>
          <button id="sky-open" type="button" class="quiet" aria-expanded="false" aria-controls="sky-panel" data-t="sky.openButton"></button>
        </div>
      </details>
    </nav>
    <button id="shortcuts-open" type="button" class="icon-button" data-dialog="shortcuts" aria-haspopup="dialog" data-t="keys.symbol" data-t-label="keys.button"></button>
  </header>

  <div id="example-banner" class="example-banner" role="note" hidden>
    <p data-t="example.short"></p>
    <a id="example-exit" href="./" data-t="example.exit"></a>
  </div>
  <p id="caption" class="caption" hidden aria-live="polite"></p>
  <div id="tour-bar" class="caption tour-bar" role="region" data-t-label="tour.label" hidden>
    <div class="tour-words" aria-live="polite">
      <p id="tour-step" class="eyebrow"></p>
      <p id="tour-text"></p>
    </div>
    <div class="tour-actions">
      <button id="tour-next" type="button" class="primary"></button>
      <button id="tour-stop" type="button" class="quiet" data-t="tour.skip"></button>
    </div>
  </div>

  <main id="main" tabindex="-1">
    <div id="notices" class="notices" aria-live="polite"></div>
    <!-- ======================= Home / Investigate ======================= -->
    <section id="page-home" class="page page-home" data-loading aria-labelledby="home-title">
      <!-- First screen (task B16): what the site is, one way in (Barnard's Star blinking), then the targets and a
           small search. The 3D map is below it. -->
      <div id="home-hero" class="home-hero">
        <div class="hero-inner">
          <h1 id="home-title" class="hero-title" tabindex="-1" data-t="hero.title"></h1>
          <p class="hero-line" data-t="hero.line"></p>
          <p class="hero-small" data-t="hero.small"></p>
          <a id="hero-watch" class="hero-watch" href="?target=barnard" data-t="hero.watch"></a>
          <!-- The Planet X Lab's answer (numbers filled in from depth.json); the whole card is one link to the Lab. -->
          <a id="hero-planetx" class="hero-planetx" href="?page=learn&amp;lesson=lab">
            <span class="chip chip-new" data-t="chip.new"></span>
            <strong class="hero-planetx-title" data-t="hero.planetxTitle"></strong>
            <span id="hero-planetx-line" class="hero-planetx-line"></span>
          </a>
          <p class="hero-links"><a href="?page=game" data-page-link="game" data-t="hero.game"></a><a href="?page=predictions" data-page-link="predictions" data-t="hero.predictions"></a></p>
          <!-- Phones (task B25): the scene behind this text opens full screen, with the time control and Fly to. -->
          <button id="hero-explore" type="button" class="hero-explore" data-t="hero.explore" hidden></button>
          <section class="hero-pick shortcuts" aria-labelledby="shortcuts-title">
            <h2 id="shortcuts-title" class="eyebrow" data-t="hero.pick"></h2>
            <ul id="shortcut-list" class="chips"></ul>
          </section>
          <form id="search" class="search hero-search" aria-labelledby="search-title">
            <h2 id="search-title" class="sr-only" data-t="search.title"></h2>
            <div class="search-line">
              <label class="sr-only" for="search-input" data-t="searchLabel"></label>
              <input id="search-input" type="text" autocomplete="off" spellcheck="false" aria-describedby="search-help search-message" data-t-placeholder="searchPlaceholder">
              <button type="submit" class="quiet" data-t="search.go"></button>
            </div>
            <!-- How to search: read out with the search box, shown at the top of the place list, and in the "?" dialog. -->
            <p id="search-help" class="hint search-tip" data-t="search.help"></p>
            <div id="search-list" class="search-list" hidden></div>
            <p id="search-message" class="form-message" aria-live="polite"></p>
          </form>
        </div>
        <a class="hero-down" href="#home-map" data-t-label="hero.toMap"><span aria-hidden="true"></span></a>
      </div>

      <div id="home-map" class="home-stage">
        <div class="scene">
          <div class="map-stage">
            <div id="map-canvas" class="map-canvas" role="group" data-t-label="map.label" hidden></div>
            <p id="map-waiting" class="map-waiting glass" data-t="map.waiting"></p>
          </div>
          <!-- 3D view (three.js), loaded after the page is usable; the 2D map above is its fallback. -->
          <div id="space3d" class="space3d" hidden></div>
          <div id="space-tools" class="space-tools" role="group" data-t-label="space.label" hidden>
            <button id="space-reset" type="button" class="quiet space-3d-only" data-t="space.reset"></button>
            <button id="space-top" type="button" class="quiet space-3d-only" data-t="space.top"></button>
            <!-- Fly to (task B11): the camera flies to a body and follows it while time runs; Esc or Reset view returns. -->
            <details id="space-fly" class="space-fly space-3d-only">
              <summary data-t="space.fly"></summary>
              <div id="space-fly-list" class="space-fly-list glass" role="group" data-t-label="space.flyLabel"></div>
            </details>
            <button id="space-toggle" type="button" class="quiet"></button>
            <button id="space-close" type="button" class="quiet space-close" data-t="hero.closeExplore"></button>
          </div>
          <!-- Time control for the 3D view (task B10); shown once the 3D scene runs. -->
          <div id="space-time" class="space-time glass space-3d-only" role="group" data-t-label="time.label" hidden>
            <button id="time-live" type="button" class="time-live" aria-pressed="false" data-t-label="time.liveLabel"><i aria-hidden="true"></i><span data-t="time.live"></span></button>
            <button id="time-play" type="button" class="time-play quiet" data-state="playing"><span aria-hidden="true"></span></button>
            <p class="time-now" data-t-label="time.dateLabel"><span id="time-date" class="time-date"></span> <span class="time-utc" data-t="time.utc"></span></p>
            <div class="time-speed">
              <input id="time-rate" type="range" min="-7" max="7" step="1" value="1" data-t-label="time.rateLabel">
              <p id="time-rate-text" class="time-rate-text" aria-hidden="true"></p>
            </div>
            <p id="time-note" class="time-note" role="status" hidden></p>
          </div>
          <div id="space-hud" class="space-hud space-3d-only">
            <p id="space-date"></p>
            <p id="space-target" aria-live="polite"></p>
          </div>
          <!-- The honesty label stays on screen as a chip; the full sentence is under "About this map" in the colour key. -->
          <p class="map-caption glass map-2d-only" data-t="map.captionShort"></p>
          <p class="map-caption glass space-3d-only" data-t="space.captionShort"></p>
          <details id="map-key" class="map-key glass">
            <summary data-t="map.legend"></summary>
            <ul id="map-legend" class="legend" hidden>
              <li class="colour-star"><i class="dot" aria-hidden="true"></i><span data-t="map.legend.star"></span></li>
              <li class="colour-variable"><i class="dot" aria-hidden="true"></i><span data-t="map.legend.variable"></span></li>
              <li class="colour-solar"><i class="dot" aria-hidden="true"></i><span data-t="map.legend.solar"></span></li>
              <li class="colour-hypothetical"><i class="dot" aria-hidden="true"></i><span class="map-2d-only" data-t="map.legend.hypothetical"></span><button id="space-nine-key" type="button" class="legend-button space-3d-only" aria-expanded="false" aria-controls="space-nine" data-t="map.legend.hypothetical"></button></li>
            </ul>
            <!-- The Planet Nine explanation: opens from its ring, its label or the entry above, never over the scene. -->
            <div id="space-nine" class="space-nine space-3d-only" hidden>
              <p id="space-nine-text"></p>
              <p class="note" data-t="space.nineHint"></p>
            </div>
            <details id="map-about" class="more-info map-about">
              <summary data-t="map.about"></summary>
              <p class="note map-2d-only" data-t="map.caption"></p>
              <p class="note space-3d-only" data-t="space.caption"></p>
              <p class="note map-2d-only" data-t="map.scale"></p>
              <p id="space-key-note" class="note space-3d-only"></p>
              <div id="map-notes" class="note map-2d-only"></div>
              <p id="space-note" class="note" hidden></p>
            </details>
          </details>
        </div>

        <div class="console-left">
        <aside id="rail" class="rail glass" aria-labelledby="rail-title">
          <button id="rail-toggle" class="rail-toggle" type="button" aria-expanded="true" aria-controls="rail-body">
            <span id="rail-title" data-t="rail.title"></span>
            <span id="rail-count" class="rail-count"></span>
          </button>
          <div id="rail-body" class="rail-body">
            <p class="note" data-t="feed.lead"></p>
            <div id="feed-list" class="rail-groups"></div>
            <p class="rail-credit" data-t="footer.credit"></p>
          </div>
        </aside>
        </div>

        <section id="sky-panel" class="sky-panel glass" hidden aria-labelledby="sky-title">
          <div class="sky-head">
            <h2 id="sky-title" data-t="sky.title"></h2>
            <button id="sky-close" type="button" class="quiet" data-t="sky.close"></button>
          </div>
          <p class="note" data-t="sky.lead"></p>
          <div id="sky" class="sky"></div>
          <p id="sky-message" class="form-message" aria-live="polite"></p>
          <p class="note" data-t="sky.credit"></p>
        </section>
      </div>
      <!-- Wide screens (task B25): the scroll room that lets the first screen's text slide off the 3D scene. -->
      <div class="home-spacer" aria-hidden="true"></div>
    </section>

    <!-- ======================= Investigation ======================= -->
    <section id="page-investigate" class="page page-investigate" hidden aria-labelledby="object-name">
      <header class="inv-head">
        <div class="inv-head-actions">
          <button id="inv-back" type="button" class="quiet" data-t="inv.back" data-t-label="inv.backLabel"></button>
          <!-- One Share button (task B17): a small menu with Copy link and Copy embed code. -->
          <span class="inv-share">
            <button id="share-toggle" type="button" class="quiet" aria-expanded="false" aria-controls="share-menu" data-t="inv.share"></button>
            <span id="share-menu" class="share-menu" role="group" data-t-label="inv.share" hidden>
              <button id="share" type="button" class="quiet" data-t="inv.copyLink"></button>
              <button id="embed-copy" type="button" class="quiet" data-t="embed.copy"></button>
            </span>
          </span>
          <a id="embed-open" class="embed-open" href="./" target="_blank" rel="noopener" data-t="embed.open"></a>
        </div>
        <label class="sr-only" for="embed-code" data-t="embed.codeLabel"></label>
        <textarea id="embed-code" class="embed-code mono" rows="3" readonly hidden></textarea>
        <div class="object">
          <h1 id="object-name" tabindex="-1"></h1>
          <!-- What it is and how far, in plain words (task B17); coordinates, field and labels under the disclosure. -->
          <p id="object-plain" class="object-plain"></p>
          <p id="loop-link-wrap" class="loop-link" hidden><a href="?page=loop" data-t="loop.link"></a></p>
          <details id="object-about" class="more-info object-about">
            <summary data-t="inv.about"></summary>
            <p id="object-kind" class="object-kind eyebrow"></p>
            <p id="object-coords" class="object-coords mono"></p>
            <p id="object-status" class="stamps"></p>
          </details>
          <span id="share-status" class="note" role="status"></span>
        </div>
      </header>

      <div id="observatory" class="stage" data-mode="blink">
        <!-- What to look at (task B17), above the picture. -->
        <p id="stage-caption" class="stage-caption" hidden></p>
        <section class="stage-view" data-t-label="viewer.label">
          <div id="plates" class="plates" data-mode="blink">
            <div id="frame-a" class="plate-frame">
              <canvas id="plate" width="1600" height="1600" tabindex="0" data-t-label="viewer.label"></canvas>
              <p id="plate-date" class="plate-date"></p>
              <p id="plate-colour" class="plate-colour" hidden data-t="colour.badge"></p>
              <p id="lock" class="lock" hidden></p>
              <p id="plate-empty" class="plate-empty" hidden></p>
            </div>
            <div id="second-frame" class="plate-frame plate-b" hidden>
              <canvas id="plate-b" width="1600" height="1600"></canvas>
              <p id="plate-date-b" class="plate-date"></p>
              <p id="plate-colour-b" class="plate-colour" hidden data-t="colour.badge"></p>
              <i id="swipe-line" class="swipe-line" aria-hidden="true"></i>
            </div>
          </div>
        </section>
        <label id="swipe-control" class="swipe-control" hidden><span data-t="swipe.label"></span>
          <input id="swipe" type="range" min="0" max="100" step="1" value="50">
        </label>
        <!-- The finding (task B17), right under the picture: how far the object moved, with numbers from the files. -->
        <p id="finding" class="finding" aria-live="polite" hidden></p>
        <div class="timebar glass" role="group" data-t-label="timebar.label">
          <div class="timebar-track">
            <button id="play" type="button" class="primary play-button"></button>
            <div id="dates" class="film" role="group" data-t-label="caption.time"></div>
          </div>
          <div class="timebar-controls">
            <div class="segment" role="group" id="modes" data-t-label="mode.label">
              <button type="button" data-mode="blink" data-t="mode.blink"></button>
              <button type="button" data-mode="swipe" data-t="mode.swipe"></button>
              <button type="button" data-mode="side" data-t="mode.side"></button>
              <button type="button" data-mode="diff" data-t="mode.diff"></button>
            </div>
            <!-- Contrast (task B23), out of "More tools": display only, one stretch shared by every date. -->
            <div class="contrast-control">
              <label for="contrast" data-t="toolContrast"></label>
              <input id="contrast" type="range" min="0.4" max="4" step="0.1" value="1">
              <button id="contrast-reset" type="button" class="contrast-reset" data-t="contrast.reset"></button>
            </div>
            <button id="colour-toggle" type="button" class="quiet colour-toggle" aria-pressed="false" data-t="colour.grayscale"></button>
            <!-- Task B12: the key number (the expected shift between A and B) stays in view; how to read the picture
                 sits behind a disclosure. -->
            <details id="explain-more" class="more-info explain-more">
              <summary data-t="viewer.howToLook"></summary>
              <p id="explain" class="explain"></p>
            </details>
          </div>
          <p id="diff-note" class="note warn" hidden data-t="mode.diffOff"></p>
        </div>
      </div>

      <div id="inv-panel" class="inv-panel">
        <nav class="panel-nav" data-t-label="panel.nav">
          <button type="button" data-panel="see" data-t="panel.see"></button>
          <button type="button" data-panel="changed" data-t="panel.changed"></button>
          <button type="button" data-panel="prediction" data-t="panel.prediction"></button>
          <button type="button" data-panel="evidence" data-t="panel.evidence"></button>
          <button type="button" data-panel="spectrum" data-t="panel.spectrum"></button>
        </nav>

        <section id="panel-see" class="panel panel-see" aria-labelledby="h-see">
          <h2 id="h-see" class="panel-title" data-t="panel.see"></h2>
          <p id="progress" class="progress" role="status"></p>
          <p id="see-empty" class="panel-note" hidden></p>
          <div id="see-tools" class="see-tools">
            <section id="caption-strip" class="caption-strip" aria-labelledby="caption-title">
              <h3 id="caption-title" data-t="caption.title"></h3>
              <div id="caption-body"></div>
            </section>
            <div class="ab" role="group" data-t-label="ab.label">
              <label class="ab-pick"><span class="ab-letter" data-t="ab.a"></span><select id="range-from"></select></label>
              <label class="ab-pick"><span class="ab-letter" data-t="ab.b"></span><select id="range-to"></select></label>
              <div class="ab-buttons">
                <button id="swap" type="button" data-t="ab.swap"></button>
                <button id="endpoints" type="button" data-t="ab.only"></button>
              </div>
            </div>
            <section class="wavelength" aria-labelledby="wavelength-title">
              <h3 id="wavelength-title" data-t="caption.wavelength"></h3>
              <div class="bands">
                <button id="composite" type="button" data-t="composite"></button>
                <output id="band-label" class="mono"></output>
                <div class="band-track">
                  <div id="band-scale" class="band-scale" aria-hidden="true"></div>
                  <input id="band" type="range" min="0" max="101" step="1" value="0" data-t-label="bandSlider">
                </div>
              </div>
              <div id="arrays" class="arrays" role="group" data-t-label="arrays.label"></div>
            </section>
            <details id="more" class="more">
              <summary data-t="viewer.more"></summary>
              <div class="tools">
                <label class="tool"><span data-t="fieldOfView"></span><select id="fov"></select></label>
                <label class="tool"><span data-t="toolSpeed"></span>
                  <select id="speed">
                    <option value="1500" data-t="speedSlow"></option>
                    <option value="900" selected data-t="speedNormal"></option>
                    <option value="350" data-t="speedFast"></option>
                  </select>
                </label>
                <label class="tool check"><input id="negative" type="checkbox"><span data-t="toolNegative"></span></label>
                <label class="tool check"><input id="gaia" type="checkbox"><span data-t="gaia"></span></label>
                <label class="tool check"><input id="wise" type="checkbox"><span data-t="wise"></span></label>
                <label class="tool check"><input id="flags" type="checkbox"><span data-t="excludeFlags"></span></label>
              </div>
              <div class="try">
                <button id="follow" type="button" class="try-main" aria-pressed="false"></button>
                <button id="fullscreen" type="button" data-t="toolFullscreen"></button>
                <button id="save-image" type="button" data-t="toolSave"></button>
              </div>
              <div id="chooser" class="chooser" hidden>
                <strong data-t="chooseTitle"></strong>
                <div id="chooser-list" class="chooser-list"></div>
                <button id="chooser-close" type="button" class="quiet" data-t="cancel"></button>
              </div>
            </details>
            <details class="more-info">
              <summary data-t="ui.details"></summary>
              <p class="note" data-t="zoomHint"></p>
              <p class="note" data-t="viewer.keys"></p>
              <p class="note"><span id="plate-info"></span></p>
            </details>
          </div>
        </section>

        <section id="panel-changed" class="panel" aria-labelledby="h-changed">
          <h2 id="h-changed" class="panel-title" data-t="panel.changed"></h2>
          <details class="more-info"><summary data-t="ui.details"></summary><p class="note" data-t="changed.lead"></p></details>
          <div id="changed-validated"></div>
          <section id="explore-box" class="explore-box" aria-labelledby="h-explore">
            <h3 id="h-explore" data-t="changed.explore"></h3>
            <p class="chip-line"><span class="chip chip-status-processed" data-t="chip.quickLook"></span></p>
            <details class="more-info"><summary data-t="ui.details"></summary><p class="note" data-t="changed.exploreLead"></p></details>
            <div class="explore-grid">
              <div>
                <h4 data-t="changed.motionTitle"></h4>
                <div id="motion-result" class="motion-result"></div>
                <button id="measure" type="button" data-t="measure"></button>
              </div>
              <div>
                <h4 data-t="changed.curveTitle"></h4>
                <div id="curve-chart" class="chart"></div>
                <p id="curve-note" class="note"></p>
                <div id="curve-table"></div>
              </div>
            </div>
          </section>
        </section>

        <section id="panel-prediction" class="panel" aria-labelledby="h-prediction">
